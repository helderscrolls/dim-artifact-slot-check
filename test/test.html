<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Artifact Slot Check test page</title>
<style>body{background:#11121a;color:#cfd1de;font:14px system-ui,sans-serif;padding:24px;min-height:100vh}pre{white-space:pre-wrap}</style>
</head>
<body>
<h1>Artifact Slot Check test page</h1>
<p>Made-up data. The panel in the bottom-left corner is the extension UI.</p>
<p>
  <button id="resave-button" type="button">Simulate re-saving a Hunter slot</button>
  <span style="color:#8d90a8">Raises the "new clash" alert. Reload the page to reset.</span>
</p>
<pre id="out"></pre>
<script src="fixture.js"></script>
<script src="../dist/inject.js"></script>
<script>
(function () {
  var output = document.getElementById('out');
  var failedCount = 0;
  var passedCount = 0;

  /** Compares two values and prints PASS or FAIL, with both values on a failure. */
  function check(description, actualValue, expectedValue) {
    var actualJson = JSON.stringify(actualValue);
    var expectedJson = JSON.stringify(expectedValue);
    var passed = actualJson === expectedJson;
    if (passed) passedCount++;
    else failedCount++;

    var line = (passed ? 'PASS ' : 'FAIL ') + description;
    if (!passed) line += '\n  got      ' + actualJson + '\n  expected ' + expectedJson;
    output.textContent += line + '\n';
  }

  var core = window.__dimArtifactSlotCheck.core;
  var perk = FIXTURE.P;
  var analysis = core.analyze(FIXTURE.profile);
  var warlock = analysis.characters.find(function (character) { return character.classType === 2; });
  var hunter = analysis.characters.find(function (character) { return character.classType === 1; });

  var warlockSlotByIndex = {};
  warlock.slots.forEach(function (slot) { warlockSlotByIndex[slot.index] = slot; });
  var slotIndexes = function (slots) { return slots.map(function (slot) { return slot.index; }); };

  // ---- reading one profile ----
  check('warlock slots with an artifact', slotIndexes(warlock.slots), [0, 1, 2, 5]);
  check('saved loadout without artifact counted', warlock.savedWithoutArtifact, 1);
  check(
    'statuses: a clash outranks an artifact mismatch',
    [0, 1, 2, 5].map(function (index) { return warlockSlotByIndex[index].status; }),
    ['clash', 'clash', 'clash', 'ok']
  );
  check('slot 1 broken perks', warlockSlotByIndex[0].brokenNow, [
    { perkHash: perk.harvest, saved: 4, current: 5 },
    { perkHash: perk.shuttle, saved: 5, current: 4 }
  ]);
  check(
    'slot 1 clashes only with slot 2',
    warlockSlotByIndex[0].clashes.map(function (clash) { return clash.otherIndex; }),
    [1]
  );
  check(
    'slot 2 clashes with slots 1 and 3',
    warlockSlotByIndex[1].clashes.map(function (clash) { return [clash.otherIndex, clash.perks.length]; }),
    [[0, 2], [2, 1]]
  );
  check('slot 3 broken on Horde Shuttle', warlockSlotByIndex[2].brokenNow, [
    { perkHash: perk.shuttle, saved: 5, current: 4 }
  ]);
  check(
    'partial slot ignores unset and empty plugs',
    [warlockSlotByIndex[5].brokenNow.length, warlockSlotByIndex[5].clashes.length],
    [0, 0]
  );
  check(
    'hunter slot broken by a rearranged artifact, with no clash',
    [hunter.slots[0].status, hunter.slots[0].clashes.length],
    ['broken', 0]
  );
  check('summary', core.summarize(analysis), { slots: 5, broken: 1, clashing: 3 });

  // ---- turning plug hashes into a layout ----
  var unsetPlugHash = core.UNSET_PLUG_HASH;
  var emptyArtifactModHash = 1235188590;
  check(
    'layoutFrom drops repeated hashes',
    Array.from(core.layoutFrom([5, 9, 9, 0, unsetPlugHash, 7])),
    [[5, 0], [7, 5]]
  );
  check(
    'layoutFrom skips a single Empty Artifact Mod',
    Array.from(core.layoutFrom([5, emptyArtifactModHash, 7])),
    [[5, 0], [7, 2]]
  );

  // ---- spotting a clash that is new since the last check ----
  // The hunter saves a second build onto the same artifact, with two perks swapped.
  var hunterResavedSlot = {
    colorHash: 1,
    iconHash: 1,
    nameHash: 12,
    items: [
      { itemInstanceId: 'W1', plugItemHashes: [1, 2, 2, 3] },
      { itemInstanceId: 'A2', plugItemHashes: [101, 102, 103, perk.shuttle, perk.harvest, 106, 107, 999] }
    ]
  };
  var changedProfile = JSON.parse(JSON.stringify(FIXTURE.profile));
  changedProfile.characterLoadouts.data.C2.loadouts[1] = hunterResavedSlot;
  var changedAnalysis = core.analyze(changedProfile);
  var newClashes = core.findNewClashes(analysis, changedAnalysis);
  var firstNewClash = newClashes[0];

  check('a re-saved slot raises exactly one new clash', newClashes.length, 1);
  check(
    'the new clash names the slots and perks',
    [firstNewClash.classType, firstNewClash.firstSlotIndex, firstNewClash.secondSlotIndex, firstNewClash.perkHashes.sort()],
    [1, 0, 1, [perk.harvest, perk.shuttle]]
  );
  check('no new clash when nothing changed', core.findNewClashes(analysis, core.analyze(FIXTURE.profile)).length, 0);
  check('a clash that went away is not reported', core.findNewClashes(changedAnalysis, analysis).length, 0);

  // ---- the suggested fix ----
  var warlockPlan = warlock.plans[0];
  check('one plan, for the clashing artifact', [warlock.plans.length, hunter.plans.length], [1, 0]);
  check(
    'plan re-saves one slot and drops none',
    [slotIndexes(warlockPlan.changes), warlockPlan.excluded.length, warlockPlan.exhaustive],
    [[1], 0, true]
  );
  check('plan moves are 1-based and line the perks up', warlockPlan.changes[0].moves, [
    { perkHash: perk.harvest, from: 5, to: 4 },
    { perkHash: perk.shuttle, from: 4, to: 5 }
  ]);

  output.textContent += '\n' + passedCount + ' passed, ' + failedCount + ' failed\n';
  window.testResult = { passed: passedCount, failed: failedCount };

  // ---- driving the page script the way DIM would: Request objects through fetch ----
  var profileUrl = 'https://www.bungie.net/Platform/Destiny2/3/Profile/123/?components=100,206';
  fetch(new Request('https://www.bungie.net/Platform/Destiny2/Manifest/'));
  fetch(new Request(profileUrl));

  // A second refresh after the hunter re-saves a slot, as DIM would do after the player saves a build.
  window.simulateResave = function () {
    FIXTURE.profile.characterLoadouts.data.C2.loadouts[1] = hunterResavedSlot;
    return fetch(new Request(profileUrl));
  };
  document.getElementById('resave-button').addEventListener('click', function () {
    window.simulateResave();
  });
})();
</script>
</body>
</html>
